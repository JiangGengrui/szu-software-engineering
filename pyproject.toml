[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.coverage.run]
source = ["album"]
branch = true
